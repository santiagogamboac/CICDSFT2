services:
  # Contenedor 2: base de datos PostgreSQL
  db:
    image: postgres:16.4-alpine
    container_name: notas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data # persistencia de los datos
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - red_notas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports": la base de datos solo es accesible dentro de la red de Docker

  # Contenedor 1: aplicación web (frontend + API)
  app:
    build: ./app
    image: notas-app:1.0.0
    container_name: notas-app
    restart: unless-stopped
    environment:
      APP_PORT: 3000
      DB_HOST: db # NOMBRE DEL SERVICIO, no localhost ni IP
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${APP_PUBLIC_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red_notas

networks:
  red_notas:
    name: red_notas
    driver: bridge

volumes:
  db_data:
    name: notas_db_data
